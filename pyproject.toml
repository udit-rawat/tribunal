[project]
name = "tribunal"
version = "0.1.0"
description = "Adversarial multi-agent fact-checker with just-in-time RAG grounding."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "instructor>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastembed>=0.4",
    "lancedb>=0.13",
    "pyarrow>=16",
    "httpx>=0.27",
    "ddgs>=6.0",
    "langfuse>=2.50",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# ragas 0.4 and langchain-community 0.4 removed a module ragas imports at load time; pinned so a
# fresh clone doesn't hit ModuleNotFoundError on langchain_community.chat_models.vertexai.
evals = [
    "ragas>=0.2,<0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3,<0.4",
]
dev = ["pytest>=8.0"]

[project.scripts]
tribunal = "tribunal.cli:main"
tribunal-mcp = "tribunal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribunal"]
